<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Phát Nhạc BASE html css</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="maint.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css"/>
</head>
<body>
    <nav class="maint-nav">
        <a href="index.html" class="active">Trình phát nhạc</a>
        <a href="maintenance.html">Bảo trì &amp; Báo lỗi</a>
        <a href="changelog.html">Nhật ký phiên bản</a>
        <button id="changeColorBtn" class="theme-btn">Dark Mode</button>
    </nav>

    <audio src="" id="audio"></audio>
    <div class="container">
        <h1 class="song-name">Ten Nhac 1</h1>
        <p class="artist">Nhac si 1</p>
        <div class="box-disk"></div>
        <div class="music-slider">
            <input type="range" value="0" class="seek-bar"/>
            <span class="current-time">00:00</span>
            <span class="music-time">00:00</span>
        </div>
        <div class="controls">
            <button class="btn btnback"><i class="fa fa-chevron-left" aria-hidden="true"></i></button>
            <button class="btn-play pause">
                <span></span>
                <span></span>
            </button>
            <button class="btn btnnext"><i class="fa fa-chevron-right" aria-hidden="true"></i></button>
        </div>
        <div class="info">
            <i class="fa fa-info-circle"></i>
            <span>Phiên bản <span id="appVersion"></span></span>
            · <a href="maintenance.html">Báo lỗi</a>
        </div>
    </div>

    <script src="song.js"></script>
    <script src="jscript.js"></script>
    <script src="maint.js"></script>
</body>
</html>
