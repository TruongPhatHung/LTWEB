<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Phát Nhạc BASE html css</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css"/> 
    <link rel="stylesheet" href="https://fontawesome.com/icons/packs/classic"/> 
</head>
<body>
   
    <audio src="" id="audio"></audio>
    <div class="container" >
       <h1 class="song-name">Ten Nhac 1</h1>   
       <p class="artist">Nhac si 1</p>
       <div class="box-disk ">
       
      
       </div>
       <div class="music-slider">
           <input type="range" value="0" class="seek-bar"/>
           <span class="current-time">00:00</span> 
           <span class="music-time">00:00</span>
         </div>
         <div class="controls">
            <button class="btn btnback"><i class="fa fa-chevron-left" aria-hidden="true"></i></button>
            <button class="btn-play pause">
                <span>s</span>
                <span></span>
            </button>
            <button class="btn btnnext"><i class="fa fa-chevron-right" aria-hidden="true"></i></button>
         
         </div>
         <script>
    let isDark = false;

    const container = document.querySelector('.container');
    const button = document.getElementById('changeColorBtn');

    button.addEventListener('click', function () {
        if (isDark) {
            container.style.backgroundColor = '#fcf0f8'; // màu sáng
            button.textContent = 'Dark Mode';
        } else {
            container.style.backgroundColor = '#333'; // màu tối
            button.textContent = 'Light Mode';
        }
        isDark = !isDark;
    });
</script>
<div class="info">
  <i class="fa-regular fa-truck"></i> 
</div>
 
       </div>
       <script src="song.js"></script>
       <script src="jscript.js"></script>
    
    
</body>
</html>
